name: Windows portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta existente (ejemplo: v1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validar etiqueta
        run: python -c "import os; from tools.release_portable import validate_tag; validate_tag(os.environ['RELEASE_TAG'])"
      - name: Fijar commit que se prueba y compila
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar suite
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Instalar herramientas de empaquetado
        run: python -m pip install -r requirements-desktop.txt
      - name: Compilar portable
        run: python build_portable.py
      - name: Probar el EXE extraído del ZIP
        run: |
          Expand-Archive -LiteralPath dist/ProxyMaker-Windows-portable.zip -DestinationPath "$env:RUNNER_TEMP/Portable smoke"
          python tools/smoke_portable.py "$env:RUNNER_TEMP/Portable smoke/ProxyMaker/ProxyMaker.exe"
      - name: Conservar ZIP verificado
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/ProxyMaker-Windows-portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist
      - name: Comprobar que la etiqueta sigue apuntando al commit probado
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.sha }}
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
      - name: Publicar release y adjuntar el ZIP sin sobrescribir archivos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/release_portable.py
